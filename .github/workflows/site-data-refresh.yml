# Pages serves committed assets, so a release sync must rebuild both the app and
# static documentation, not just update the source version fields.
name: site-data-refresh
on:
  release:
    types: [published]
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: site-release-sync
  cancel-in-progress: false
jobs:
  refresh-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked site dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync current installation examples to the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          npm run sync:release -- "$TAG"
      - name: Rebuild the app and static documentation
        run: npm run build
      - name: Commit the complete published site
        run: |
          set -eu
          git add package.json package-lock.json data/site-data.json content/docs/installation.md \
            assets/app.js assets/styles.css index.html docs llms.txt llms-full.txt robots.txt sitemap.xml
          if git diff --cached --quiet; then echo "published site already in sync"; exit 0; fi
          VER="$(node -p 'require("./package.json").version')"
          git config user.name "atlas-site-bot"
          git config user.email "atlas-site-bot@users.noreply.github.com"
          git commit -m "site-data: publish complete site for $VER (release sync)"
          git push origin HEAD:main
      - name: Request a Pages build (pushes by GITHUB_TOKEN skip workflow triggers)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
